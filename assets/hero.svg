<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Lao Gao — Building what comes next.</title>
<desc id="desc">AI applications, agents and developer tools. Independent builder, open source.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1527"/><stop offset="1" stop-color="#110e26"/></linearGradient>
<linearGradient id="ink"><stop stop-color="#83f6d2"/><stop offset=".55" stop-color="#a4c6ff"/><stop offset="1" stop-color="#cfafff"/></linearGradient>
<radialGradient id="aurora"><stop stop-color="#6860c9" stop-opacity=".35"/><stop offset="1" stop-color="#6860c9" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#7390b6" stroke-opacity=".07"/></pattern>
<style>
.orbit{transform-origin:939px 201px;animation:orbit 42s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.dash{animation:flow 16s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@keyframes flow{to{stroke-dashoffset:-160}}
@media(prefers-reduced-motion:reduce){.orbit,.pulse,.dash{animation:none}}
</style>
</defs>
<rect width="1200" height="410" rx="24" fill="url(#bg)"/><rect width="1200" height="410" rx="24" fill="url(#grid)"/>
<ellipse cx="930" cy="180" rx="320" ry="245" fill="url(#aurora)"/>
<rect x=".5" y=".5" width="1199" height="409" rx="24" fill="none" stroke="#33425b"/>
<g font-family="Inter,Segoe UI,Arial,Microsoft YaHei,sans-serif">
<circle class="pulse" cx="45" cy="45" r="5" fill="#73efc2"/><text x="61" y="50" fill="#a0b8ca" font-size="12" letter-spacing="3">INDEPENDENT BUILDER · OPEN SOURCE</text>
<text x="42" y="149" font-size="89" font-weight="750" letter-spacing="-4" fill="url(#ink)">Lao Gao<tspan dx="20" font-size="24" letter-spacing="1" fill="#a8bad1" font-weight="400">老高 · 高鹏彬</tspan></text>
<text x="45" y="210" fill="#edf3ff" font-size="34" font-weight="600" letter-spacing="-1">Building what comes next.</text>
<text x="46" y="251" fill="#a8bad1" font-size="18">把 AI 接进真实工作流，把想法做成可用的产品。</text>
<g font-size="12" font-weight="600" letter-spacing="1">
<rect x="45" y="281" width="140" height="32" rx="16" fill="#16322f" stroke="#265447"/><text x="65" y="302" fill="#80e4c1">AI APPLICATIONS</text>
<rect x="197" y="281" width="99" height="32" rx="16" fill="#202944" stroke="#3c4c6d"/><text x="218" y="302" fill="#9fc0ff">AGENTS</text>
<rect x="308" y="281" width="120" height="32" rx="16" fill="#2a2442" stroke="#51406c"/><text x="328" y="302" fill="#c5abf5">DEV TOOLS</text>
<rect x="440" y="281" width="136" height="32" rx="16" fill="#162f3c" stroke="#305167"/><text x="460" y="302" fill="#8fd5e9">GEOSPATIAL</text>
</g>
<path d="M45 349H680" stroke="#28394f"/><text x="45" y="379" fill="#8198b4" font-size="11" letter-spacing="2">DESIGN → BUILD → SHIP → ITERATE</text>
<text x="680" y="379" fill="#8198b4" font-size="11" text-anchor="end">BEIJING / EARTH</text>
<g fill="none" stroke="#7087b8" stroke-opacity=".3">
<circle cx="939" cy="201" r="141"/><circle cx="939" cy="201" r="114" stroke-dasharray="3 9" class="dash"/>
<ellipse cx="939" cy="201" rx="163" ry="61" transform="rotate(-33 939 201)"/><ellipse cx="939" cy="201" rx="163" ry="61" transform="rotate(33 939 201)"/>
</g>
<g class="orbit"><circle cx="939" cy="60" r="7" fill="#77f1c9"/><circle cx="1061" cy="272" r="5" fill="#ac9bff"/><circle cx="817" cy="272" r="5" fill="#89c8ff"/></g>
<path d="M939 129L1002 165V237L939 273L876 237V165Z" fill="#14293a" stroke="url(#ink)" stroke-width="2"/>
<path d="M876 165L939 201L1002 165M939 201V273" fill="none" stroke="url(#ink)" stroke-width="2"/>
<path d="M906 184L939 165L972 184L939 203Z" fill="#68ecc8" opacity=".35"/>
<text x="939" y="365" fill="#9cb0cc" font-size="11" text-anchor="middle" letter-spacing="3">HUMAN INTENT × MACHINE CAPABILITY</text>
</g></svg>
