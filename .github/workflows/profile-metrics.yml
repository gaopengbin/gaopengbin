name: Refresh public profile metrics
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-metrics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read public GitHub data and render SVG cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/profile_metrics.py
      - name: Validate metrics and rendering
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Commit changed metrics only
        run: |
          git add assets/metrics.svg assets/activity.svg assets/profile-metrics.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public profile metrics'
          git push
